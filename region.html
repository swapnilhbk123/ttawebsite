<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Network | TTA Group Adventure Agency</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Syne:wght@400;700;800&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #050505; --card: #0c0c0c; --accent: #c5a059; --text: #ffffff; --dim: #a0a0a0; --border: rgba(197, 160, 89, 0.15); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; }
        
        nav { 
            padding: 25px 8%; border-bottom: 1px solid var(--border); display: flex; 
            justify-content: space-between; align-items: center; position: sticky; 
            top:0; background: rgba(5,5,5,0.9); z-index: 100; backdrop-filter: blur(15px); 
        }
        .logo { font-family: 'Syne'; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; color: #fff; font-size: 0.75rem; }
        
        header { padding: 100px 8% 40px; }
        .section-tag { color: var(--accent); font-weight: 800; letter-spacing: 4px; font-size: 0.6rem; text-transform: uppercase; margin-bottom: 10px; display: block; }
        h1 { font-family: 'Syne'; font-size: clamp(2.5rem, 6vw, 4.5rem); text-transform: uppercase; letter-spacing: -2px; font-weight: 800; line-height: 0.9; }

        .dest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; padding: 0 8% 120px; }
        .dest-card { 
            height: 380px; background: var(--card); border-radius: 4px; 
            position: relative; overflow: hidden; cursor: pointer; border: 1px solid var(--border); 
            transition: 0.4s;
        }
        .dest-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .dest-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; transition: 0.8s cubic-bezier(0.2, 1, 0.3, 1); }
        .dest-card:hover img { opacity: 0.8; transform: scale(1.08); }
        
        .dest-info { position: absolute; bottom: 30px; left: 30px; z-index: 2; }
        .dest-info h3 { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; color: #fff; font-style: italic; line-height: 1.1; }
        .dest-info span { font-size: 0.65rem; color: var(--accent); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; display: block; margin-bottom: 5px; }

        .footer { padding: 60px 8%; text-align: center; border-top: 1px solid var(--border); font-size: 0.7rem; color: var(--dim); letter-spacing: 1px; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">TTA Group Adventure Agency</a>
        <a href="index.html" style="color:var(--accent); text-decoration:none; font-size:0.7rem; font-weight:800; letter-spacing:1px;">← BACK TO HOME</a>
    </nav>

    <header>
        <span class="section-tag" id="regionTag">GLOBAL NETWORK</span>
        <h1 id="regionName">Loading Region...</h1>
    </header>

    <div class="dest-grid" id="destContainer"></div>

    <footer class="footer">
        © 2026 TTA GROUP ADVENTURE AGENCY | OFFICIAL DMC NETWORK
    </footer>

    <script>
        const data = {
            caucasus: { 
                name: "Caucasus & Central Asia", 
                tag: "Bridges of Eurasia",
                list: [
                    { name: "Azerbaijan", img: "https://images.pexels.com/photos/5698867/pexels-photo-5698867.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" },
                    { name: "Georgia", img: "https://images.pexels.com/photos/10100412/pexels-photo-10100412.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" },
                    { name: "Kazakhstan", img: "https://images.pexels.com/photos/14812836/pexels-photo-14812836.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" },
                    { name: "Uzbekistan", img: "https://images.pexels.com/photos/11056501/pexels-photo-11056501.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" },
                    { name: "Russia", img: "https://images.pexels.com/photos/2362917/pexels-photo-2362917.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" }
                ] 
            },
            seasia: { 
                name: "Southeast Asia", 
                tag: "Tropical Operations",
                list: [
                    { name: "Bali", img: "https://images.pexels.com/photos/2166559/pexels-photo-2166559.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" },
                    { name: "Thailand", img: "https://images.pexels.com/photos/4320473/pexels-photo-4320473.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" },
                    { name: "Vietnam", img: "https://images.pexels.com/photos/2303781/pexels-photo-2303781.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" },
                    { name: "Singapore", img: "https://images.pexels.com/photos/592753/pexels-photo-592753.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" },
                    { name: "Malaysia", img: "https://images.pexels.com/photos/2135677/pexels-photo-2135677.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" },
                    { name: "Philippines", img: "https://images.pexels.com/photos/1628150/pexels-photo-1628150.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" }
                ] 
            },
            eastasia: { 
                name: "East Asia", 
                tag: "The Pacific Rim",
                list: [
                    { name: "China", img: "https://images.pexels.com/photos/3408353/pexels-photo-3408353.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" },
                    { name: "Japan", img: "https://images.pexels.com/photos/161401/fuji-mountain-mountain-flowers-cherry-blossoms-161401.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" },
                    { name: "South Korea", img: "https://images.pexels.com/photos/2314983/pexels-photo-2314983.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" }
                ] 
            },
            islands: { 
                name: "Islands & Africa", 
                tag: "Pristine Destinations",
                list: [
                    { name: "Seychelles", img: "https://images.pexels.com/photos/2444403/pexels-photo-2444403.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" },
                    { name: "Maldives", img: "https://images.pexels.com/photos/1320686/pexels-photo-1320686.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" },
                    { name: "Sri Lanka", img: "https://images.pexels.com/photos/1531660/pexels-photo-1531660.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" },
                    { name: "Mauritius", img: "https://images.pexels.com/photos/1592318/pexels-photo-1592318.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" },
                    { name: "Egypt", img: "https://images.pexels.com/photos/3889987/pexels-photo-3889987.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" },
                    { name: "Kenya", img: "https://images.pexels.com/photos/1018598/pexels-photo-1018598.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" }
                ] 
            },
            eurome: { 
                name: "Europe & Middle East", 
                tag: "Historic Excellence",
                list: [
                    { name: "Turkey", img: "https://images.pexels.com/photos/2048865/pexels-photo-2048865.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" },
                    { name: "Dubai", img: "https://images.pexels.com/photos/2044434/pexels-photo-2044434.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" },
                    { name: "Italy", img: "https://images.pexels.com/photos/1105666/pexels-photo-1105666.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" },
                    { name: "France", img: "https://images.pexels.com/photos/699466/pexels-photo-699466.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" },
                    { name: "Switzerland", img: "https://images.pexels.com/photos/415574/pexels-photo-415574.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" },
                    { name: "Netherlands", img: "https://images.pexels.com/photos/208732/pexels-photo-208732.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" }
                ] 
            }
        };

        const params = new URLSearchParams(window.location.search);
        const regionKey = params.get('region');
        
        if(regionKey && data[regionKey]) {
            const region = data[regionKey];
            document.getElementById('regionName').innerText = region.name;
            document.getElementById('regionTag').innerText = region.tag;
            
            const container = document.getElementById('destContainer');
            region.list.forEach(dest => {
                const searchID = dest.name.toLowerCase().replace(/\s+/g, '');
                container.innerHTML += `
                    <div class="dest-card" onclick="location.href='destination.html?id=${searchID}'">
                        <img src="${dest.img}" alt="${dest.name}">
                        <div class="dest-info">
                            <span>GROUND OPS</span>
                            <h3>${dest.name}</h3>
                        </div>
                    </div>`;
            });
        } else {
            location.href = 'index.html';
        }
    </script>
</body>
</html>
