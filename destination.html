<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinations | TTA Group Adventure Agency</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #000000;
            --card-bg: #0a0a0a;
            --text-main: #ffffff;
            --text-dim: #888888;
            --accent: #3b82f6; 
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); line-height: 1.6; }

        nav { padding: 30px 8%; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.9); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 800; font-size: 0.9rem; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; }
        .back-btn { color: var(--text-main); text-decoration: none; font-size: 0.8rem; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }

        header { padding: 80px 8% 40px; }
        #dest-title { font-size: clamp(3rem, 8vw, 5rem); font-weight: 800; text-transform: uppercase; letter-spacing: -2px; }
        .breadcrumb { color: var(--accent); font-weight: 600; letter-spacing: 2px; text-transform: uppercase; font-size: 0.7rem; margin-bottom: 10px; }

        /* Package Grid */
        .package-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; padding: 0 8% 100px; }
        .package-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; transition: 0.4s cubic-bezier(0.19, 1, 0.22, 1); }
        .package-card:hover { transform: translateY(-10px); border-color: var(--accent); }
        .package-img { width: 100%; height: 240px; background-size: cover; background-position: center; }
        
        .package-body { padding: 30px; }
        .package-tag { font-size: 0.6rem; color: var(--accent); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; display: block; }
        .package-body h3 { font-size: 1.4rem; margin-bottom: 15px; font-weight: 600; }
        .package-body p { color: var(--text-dim); font-size: 0.95rem; margin-bottom: 25px; }

        .btn-enquire { display: block; width: 100%; padding: 18px; background: #fff; color: #000; text-align: center; text-decoration: none; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; font-size: 0.75rem; border-radius: 12px; transition: 0.3s; }
        .btn-enquire:hover { background: var(--accent); color: #fff; }

        #no-results { padding: 100px 8%; text-align: center; color: var(--text-dim); display: none; }

        @media (max-width: 768px) {
            header { padding-top: 40px; }
            .package-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="window.location.href='index.html'">TTA Group</div>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> BACK TO EXPLORE</a>
    </nav>

    <header>
        <div class="breadcrumb">Destination Itineraries</div>
        <h1 id="dest-title">Packages</h1>
    </header>

    <div id="no-results">
        <h2>No packages found for this destination yet.</h2>
        <p>Please contact us directly for a custom itinerary.</p>
    </div>

    <section class="package-grid" id="pkg-container"></section>

    <script>
        // THE DATABASE: Add all your packages here. 
        // Ensure 'destID' matches the 'id' we set in index.html
        const allPackages = [
            // BALI PACKAGES
            { destID: 'bali', title: 'Ubud Spiritual Escape', duration: '4 Days / 3 Nights', desc: 'Private pool villas, waterfall tours, and sacred monkey forest exploration.', img: 'images/bali-ubud.jpg' },
            { destID: 'bali', title: 'Seminyak Luxury Sun', duration: '6 Days / 5 Nights', desc: 'Beachfront living, sunset cruises, and world-class dining experiences.', img: 'images/bali-beach.jpg' },
            
            // GEORGIA PACKAGES
            { destID: 'georgia', title: 'Tbilisi & Kazbegi Heights', duration: '5 Days / 4 Nights', desc: 'Explore the old city charms and the dramatic mountains of the Caucasus.', img: 'images/georgia-mountains.jpg' },
            
            // SEYCHELLES PACKAGES
            { destID: 'seychelles', title: 'Praslin & Mahe Private Tour', duration: '8 Days / 7 Nights', desc: 'Island hopping with private transfers and exclusive beach access.', img: 'images/seychelles-main.jpg' },
            
            // AZERBAIJAN PACKAGES
            { destID: 'azerbaijan', title: 'Baku Modernity & Gabala Nature', duration: '6 Days', desc: 'A perfect mix of the Flame Towers and the serene Gabala landscape.', img: 'images/baku.jpg' },

            // MALAYSIA PACKAGES
            { destID: 'malaysia', title: 'Kuala Lumpur & Genting Fun', duration: '5 Days', desc: 'City lights, Batu Caves, and the highlands theme park.', img: 'images/kl.jpg' }
            
            // To add more: copy a line above, change the destID, title, and desc.
        ];

        // LOGIC: Get the ID from the URL (e.g., ?id=bali)
        const urlParams = new URLSearchParams(window.location.search);
        const currentID = urlParams.get('id');

        const titleEl = document.getElementById('dest-title');
        const container = document.getElementById('pkg-container');
        const emptyState = document.getElementById('no-results');

        if (currentID) {
            titleEl.innerText = currentID.charAt(0).toUpperCase() + currentID.slice(1);
            
            // Filter packages that match the clicked destination
            const filtered = allPackages.filter(p => p.destID === currentID.toLowerCase());

            if (filtered.length > 0) {
                filtered.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'package-card';
                    card.innerHTML = `
                        <div class="package-img" style="background-image: url('${p.img}')"></div>
                        <div class="package-body">
                            <span class="package-tag">${p.duration}</span>
                            <h3>${p.title}</h3>
                            <p>${p.desc}</p>
                            <a href="https://wa.me/919028227102?text=I'm interested in the ${p.title} package" class="btn-enquire">Request Quote</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } else {
                emptyState.style.display = 'block';
            }
        } else {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
