<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expeditions | TTA Group Adventure Agency</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #000; --accent: #3b82f6; --text: #fff; --dim: #888; --card: #0a0a0a; --border: rgba(255,255,255,0.1); }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; margin: 0; }
        
        .top-nav { position: fixed; top: 0; width: 100%; padding: 25px 8%; display: flex; justify-content: space-between; align-items: center; z-index: 1000; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); }
        .nav-back { color: var(--text); text-decoration: none; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; }
        
        .hero { height: 40vh; display: flex; flex-direction: column; justify-content: center; padding: 0 8%; background: #050505; border-bottom: 1px solid var(--border); margin-top: 70px; }
        h1 { font-size: clamp(3rem, 10vw, 5rem); text-transform: uppercase; letter-spacing: -3px; margin: 0; line-height: 1; font-weight: 800; }
        .region-tag { color: var(--accent); letter-spacing: 5px; text-transform: uppercase; font-size: 0.7rem; margin-top: 15px; font-weight: 600; }

        .package-grid { padding: 60px 8%; display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 30px; }
        .package-card { background: var(--card); border: 1px solid var(--border); padding: 40px; border-radius: 20px; transition: 0.4s ease; }
        .package-card:hover { border-color: var(--accent); transform: translateY(-10px); }
        
        /* Itinerary Styling */
        .step { margin-bottom: 15px; border-left: 1px solid #222; padding-left: 15px; }
        .step-day { color: var(--accent); font-size: 0.6rem; font-weight: 800; text-transform: uppercase; }
        .step-info { font-size: 0.9rem; color: #ccc; }

        .btn { display: block; width: 100%; padding: 20px; text-align: center; text-decoration: none; font-weight: 800; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; margin-top: 20px; }
        .btn-p { background: #fff; color: #000; }
        .btn-s { border: 1px solid #333; color: #fff; }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="index.html" class="nav-back"><i class="fas fa-arrow-left"></i> RETURN</a>
        <div style="font-weight: 800; font-size: 0.8rem; letter-spacing: 2px;">TTA GROUP <span style="color:var(--accent)">ADVENTURE AGENCY</span></div>
    </nav>
    
    <header class="hero">
        <h1 id="countryName">DESTINATION</h1>
        <div class="region-tag" id="regionName">GLOBAL TRAVEL DMC</div>
    </header>

    <main class="package-grid" id="packageGrid"></main>

    <script>
        // Your existing allPackages object and rendering logic here...
    </script>
</body>
</html>
