<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Itineraries | TTA Group Adventure Agency</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --card: #0a0a0a; --accent: #3b82f6; --text: #fff; --dim: #888; --border: rgba(255,255,255,0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.6; }
        nav { padding: 25px 8%; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; position: sticky; top:0; background: rgba(0,0,0,0.9); z-index: 100; backdrop-filter: blur(10px); }
        header { padding: 80px 8% 40px; }
        h1 { font-size: clamp(3rem, 8vw, 6rem); text-transform: uppercase; letter-spacing: -3px; font-weight: 800; line-height: 1; }
        .pkg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 30px; padding: 0 8% 100px; }
        .pkg-card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 45px; display: flex; flex-direction: column; }
        .tag { color: var(--accent); font-size: 0.7rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 15px; }
        .itin-box { background: rgba(255,255,255,0.03); padding: 25px; border-radius: 15px; font-size: 0.9rem; margin: 30px 0; color: var(--dim); border: 1px solid rgba(255,255,255,0.03); flex-grow: 1; }
        .btn { background: #fff; color: #000; padding: 20px; text-align: center; text-decoration: none; font-weight: 800; text-transform: uppercase; font-size: 0.75rem; border-radius: 12px; transition: 0.3s; }
        .btn:hover { background: var(--accent); color: #fff; }
        .form-sec { padding: 100px 8%; background: #050505; border-top: 1px solid var(--border); }
        .form-container { max-width: 600px; margin: 0 auto; text-align: center; }
        input, textarea { background: transparent; border: none; border-bottom: 1px solid #333; padding: 20px; color: #fff; width: 100%; margin-bottom: 30px; outline: none; font-size: 1rem; }
    </style>
</head>
<body>
    <nav><div onclick="location.href='index.html'" style="cursor:pointer; font-weight:800; letter-spacing: 2px;">TTA Group Adventure Agency</div><a href="index.html" style="color:#fff; text-decoration:none; font-size:0.8rem; font-weight:800;">← BACK</a></nav>
    <header><h1 id="title">Operations</h1></header>
    <div class="pkg-grid" id="container"></div>

    <section class="form-sec" id="enquiry">
        <div class="form-container">
            <h2 style="margin-bottom: 40px; font-size: 2.5rem;">REQUEST B2B QUOTE</h2>
            <form action="https://formspree.io/f/xbdlnwyw" method="POST">
                <input type="text" name="name" placeholder="AGENCY / CONTACT NAME" required>
                <input type="text" id="subject" name="interest" readonly style="color:var(--accent); font-weight:800;">
                <textarea name="msg" id="msg-box" rows="4" placeholder="DESCRIBE YOUR GROUP REQUIREMENTS"></textarea>
                <button type="submit" style="background:#fff; color:#000; border:none; padding:25px; width: 100%; font-weight:800; cursor:pointer; text-transform: uppercase; letter-spacing: 2px;">SEND ENQUIRY</button>
            </form>
        </div>
    </section>

    <script>
        const pkgs = [
            // EAST ASIA
            { id: 'japan', tag: 'High Demand', name: 'Tokyo & Kyoto Golden Route', itin: 'D1: Arrival Narita. D2: Tokyo City (Shibuya/Asakusa). D3: Shinkansen to Kyoto. D4: Arashiyama & Fushimi Inari. D5: Nara Deer Park. D6: Departure KIX.' },
            { id: 'china', tag: 'Imperial', name: 'Great Wall & Forbidden City', itin: 'D1: Beijing Arrival. D2: Forbidden City & Summer Palace. D3: Mutianyu Great Wall 4x4 Access. D4: Temple of Heaven. D5: Departure.' },
            { id: 'south korea', tag: 'Cultural', name: 'Seoul City & DMZ Border', itin: 'D1: Arrival. D2: Gyeongbokgung Palace. D3: DMZ North Korea Border Tour. D4: Nami Island. D5: Myeongdong & Departure.' },
            
            // CAUCASUS
            { id: 'azerbaijan', tag: 'Bestseller', name: 'Baku Modernity & Old City', itin: 'D1: Arrival. D2: Flame Towers & Old City. D3: Gobustan Mud Volcanoes. D4: Fire Temple. D5: Departure.' },
            { id: 'georgia', tag: 'Adventure', name: 'Tbilisi & Kazbegi 4x4', itin: 'D1: Arrival. D2: City Tour. D3: Ananuri & Kazbegi (Gergeti Trinity). D4: Kakheti Wine Route. D5: Departure.' },
            
            // SOUTHEAST ASIA
            { id: 'bali', tag: 'Luxury', name: 'Ubud Jungle & Coastal Sunset', itin: 'D1: Arrival. D2: Ubud Rice Terraces. D3: Kintamani Volcano Tour. D4: Tanah Lot Sunset. D5: Nusa Penida Day Trip. D6: Departure.' },
            { id: 'thailand', tag: 'Islands', name: 'Phuket & Phi Phi Getaway', itin: 'D1: Arrival. D2: Phi Phi Speedboat Tour. D3: James Bond Island. D4: Phuket City & Big Buddha. D5: Departure.' },
            { id: 'malaysia', tag: 'Bestseller', name: 'KL City & Genting Highlands', itin: 'D1: Arrival. D2: KL City & Batu Caves. D3: Genting Highlands Cable Car. D4: Putrajaya Tour. D5: Departure.' },
            { id: 'philippines', tag: 'Tropical', name: 'Manila & Boracay Beach', itin: 'D1: Manila. D2: Intramuros Tour. D3: Fly to Boracay. D4: Island Hopping. D5: Departure.' },
            { id: 'vietnam', tag: 'Heritage', name: 'Hanoi & Halong Bay Cruise', itin: 'D1: Hanoi. D2: Halong Bay Overnight Cruise. D3: Return to Hanoi. D4: Old Quarter Tour. D5: Departure.' },
            { id: 'singapore', tag: 'Modern', name: 'Singapore City & Sentosa', itin: 'D1: Arrival. D2: Gardens by the Bay. D3: Universal Studios. D4: Night Safari. D5: Departure.' },

            // EUROPE & MIDDLE EAST
            { id: 'turkey', tag: 'Historical', name: 'Istanbul & Cappadocia Balloons', itin: 'D1: Istanbul. D2: Blue Mosque & Hagia Sophia. D3: Fly to Cappadocia. D4: Hot Air Balloon & Cave Tour. D5: Departure.' },
            { id: 'dubai', tag: 'Luxury', name: 'Burj Khalifa & Desert Safari', itin: 'D1: Arrival. D2: Burj Khalifa & Mall. D3: 4x4 Desert Safari & BBQ. D4: Abu Dhabi Day Trip. D5: Departure.' },
            { id: 'france', tag: 'Romantic', name: 'Paris City & Seine River', itin: 'D1: Arrival. D2: Eiffel Tower. D3: Louvre & Montmartre. D4: Disneyland Paris. D5: Departure.' },
            { id: 'switzerland', tag: 'Scenic', name: 'Swiss Alps & Mt. Titlis', itin: 'D1: Zurich. D2: Lucerne City. D3: Mt. Titlis Snow Adventure. D4: Jungfraujoch. D5: Departure.' },
            { id: 'netherlands', tag: 'Cultural', name: 'Amsterdam Canals & Tulips', itin: 'D1: Arrival. D2: Canal Cruise. D3: Keukenhof/Zaanse Schans. D4: Rotterdam. D5: Departure.' },
            { id: 'italy', tag: 'Art', name: 'Rome, Florence & Venice', itin: 'D1: Rome. D2: Colosseum & Vatican. D3: Train to Florence. D4: Venice Canals. D5: Departure.' },

            // ISLANDS & AFRICA
            { id: 'seychelles', tag: 'Premium', name: 'Mahe & Praslin Island Hopper', itin: 'D1: Mahe. D2: Praslin Ferry. D3: Vallee de Mai. D4: La Digue Boat Trip. D5: Private Charter. D6: Departure.' },
            { id: 'maldives', tag: 'Luxury', name: 'Private Water Villa Retreat', itin: 'D1: Speedboat. D2-D4: Island Life & Water Sports. D5: Male City Tour. D6: Departure.' },
            { id: 'egypt', tag: 'History', name: 'Pyramids & Nile Exploration', itin: 'D1: Cairo Pyramids. D2: Sphinx & Museum. D3: Nile Cruise Check-in. D4: Luxor Temples. D5: Departure.' },
            { id: 'kenya', tag: 'Safari', name: 'Maasai Mara Wildlife Safari', itin: 'D1: Nairobi. D2-D3: Maasai Mara Game Drives. D4: Lake Nakuru. D5: Departure.' },
            { id: 'mauritius', tag: 'Island', name: 'Mauritius South Island Tour', itin: 'D1: Arrival. D2: Chamarel Earth. D3: Ile aux Cerfs. D4: North Tour. D5: Departure.' },
            { id: 'srilanka', tag: 'Scenic', name: 'Kandy & Nuwara Eliya Tea', itin: 'D1: Colombo. D2: Kandy Temple. D3: Tea Gardens. D4: Bentota Beach. D5: Departure.' }
        ];

        const id = new URLSearchParams(window.location.search).get('id');
        const container = document.getElementById('container');
        if(id) {
            const cleanId = decodeURIComponent(id).toLowerCase().trim();
            document.getElementById('title').innerText = cleanId.toUpperCase();
            document.getElementById('subject').value = "INQUIRY: " + cleanId.toUpperCase();
            const filtered = pkgs.filter(p => p.id === cleanId);
            if(filtered.length > 0) {
                filtered.forEach(p => {
                    container.innerHTML += `<div class="pkg-card">
                        <span class="tag">${p.tag}</span>
                        <h3>${p.name}</h3>
                        <div class="itin-box"><strong>Sample B2B Itinerary:</strong><br>${p.itin}</div>
                        <a href="#enquiry" class="btn" onclick="prefill('${p.name}')">Request PDF Quote</a>
                    </div>`;
                });
            } else {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align:center;"><p style="color:var(--dim)">Detailed ground operational documents for ${cleanId.toUpperCase()} are currently available on request.</p></div>`;
            }
        }
        function prefill(pkg) {
            document.getElementById('subject').value = "PACKAGE: " + pkg;
            document.getElementById('msg-box').value = "I am interested in receiving the full PDF itinerary and B2B ground rates for: " + pkg;
        }
    </script>
</body>
</html>
