<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Ground Itineraries | TTA Group Adventure Agency</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --card: #0a0a0a; --accent: #3b82f6; --text: #fff; --dim: #888; --border: rgba(255,255,255,0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.6; overflow-x: hidden; }
        nav { padding: 25px 8%; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; position: sticky; top:0; background: rgba(0,0,0,0.9); z-index: 100; backdrop-filter: blur(10px); }
        .logo { font-weight: 800; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; color: #fff; }
        header { padding: 100px 8% 40px; }
        h1 { font-size: clamp(3rem, 8vw, 6rem); text-transform: uppercase; letter-spacing: -3px; font-weight: 800; line-height: 1; }
        .pkg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 30px; padding: 0 8% 100px; }
        .pkg-card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 45px; display: flex; flex-direction: column; transition: 0.3s; }
        .pkg-card:hover { border-color: var(--accent); }
        .tag { color: var(--accent); font-size: 0.7rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 15px; }
        .itin-box { background: rgba(255,255,255,0.03); padding: 25px; border-radius: 15px; font-size: 0.9rem; margin: 30px 0; color: var(--dim); border: 1px solid rgba(255,255,255,0.03); flex-grow: 1; }
        .btn { background: #fff; color: #000; padding: 20px; text-align: center; text-decoration: none; font-weight: 800; text-transform: uppercase; font-size: 0.75rem; border-radius: 12px; transition: 0.3s; cursor: pointer; }
        .btn:hover { background: var(--accent); color: #fff; }
        
        /* Updated Form Section */
        .form-sec { padding: 120px 8%; background: #050505; border-top: 1px solid var(--border); }
        .form-container { max-width: 600px; margin: 0 auto; text-align: center; }
        input, textarea { background: transparent; border: none; border-bottom: 1px solid #333; padding: 20px; color: #fff; width: 100%; margin-bottom: 30px; outline: none; font-size: 1rem; transition: 0.3s; }
        input:focus { border-bottom-color: var(--accent); }
        .submit-btn { background: #fff; color: #000; border: none; padding: 25px; width: 100%; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">TTA Group Adventure Agency</a>
        <a href="index.html" style="color:var(--dim); text-decoration:none; font-size:0.8rem; font-weight:800;">← BACK</a>
    </nav>

    <header><h1 id="title">Operations</h1></header>
    
    <div class="pkg-grid" id="container"></div>

    <section class="form-sec" id="enquiry">
        <div class="form-container">
            <h2 style="margin-bottom: 40px; font-size: 2.5rem; font-weight: 800;">REQUEST B2B QUOTE</h2>
            <form action="https://formspree.io/f/xbdlnwyw" method="POST">
                <input type="text" name="agency" placeholder="YOUR AGENCY NAME" required>
                <input type="email" name="email" placeholder="OFFICIAL EMAIL ID" required>
                <input type="tel" name="phone" placeholder="PHONE / WHATSAPP (WITH COUNTRY CODE)" required>
                <input type="text" id="subject" name="interest" readonly style="color:var(--accent); font-weight:800;">
                <textarea name="msg" id="msg-box" rows="4" placeholder="PLEASE SPECIFY TRAVEL DATES & GROUP SIZE"></textarea>
                <button type="submit" class="submit-btn">SEND ENQUIRY</button>
            </form>
        </div>
    </section>

    <script>
        const pkgs = [
            // CAUCASUS & CENTRAL ASIA
            { id: 'azerbaijan', tag: 'Bestseller', name: 'Baku Modernity & Old City', itin: 'D1: Arrival. D2: Flame Towers & Old City. D3: Gobustan Mud Volcanoes. D4: Fire Temple. D5: Departure.' },
            { id: 'georgia', tag: 'Top Rated', name: 'Tbilisi & Kazbegi 4x4', itin: 'D1: Arrival. D2: City Tour. D3: Ananuri & Kazbegi Gergeti Trinity. D4: Kakheti Wine Region. D5: Departure.' },
            { id: 'kazakhstan', tag: 'Adventure', name: 'Almaty & Charyn Canyon', itin: 'D1: Arrival. D2: Medeu & Shymbulak. D3: Charyn Canyon Adventure. D4: Big Almaty Lake. D5: Departure.' },
            { id: 'uzbekistan', tag: 'Silk Road', name: 'Tashkent & Samarkand Rail', itin: 'D1: Tashkent. D2: High-speed rail to Samarkand. D3: Registan Square. D4: Return to Tashkent. D5: Departure.' },
            { id: 'russia', tag: 'Imperial', name: 'Moscow & St. Petersburg', itin: 'D1: Moscow. D2: Red Square & Kremlin. D3: Sapsan Train to St. Petersburg. D4: Hermitage Museum. D5: Departure.' },

            // SOUTHEAST ASIA
            { id: 'bali', tag: 'Luxury', name: 'Ubud Jungle & Coastal Sunset', itin: 'D1: Arrival. D2: Ubud Rice Terraces. D3: Kintamani Volcano. D4: Tanah Lot & Uluwatu. D5: Nusa Penida. D6: Departure.' },
            { id: 'thailand', tag: 'Popular', name: 'Bangkok & Pattaya Leisure', itin: 'D1: Arrival. D2: Coral Island Boat. D3: Bangkok Temple Tour. D4: Safari World. D5: Departure.' },
            { id: 'vietnam', tag: 'Heritage', name: 'Hanoi & Halong Bay Cruise', itin: 'D1: Hanoi. D2: Halong Bay Overnight Cruise. D3: Old Quarter Tour. D4: Ninh Binh. D5: Departure.' },
            { id: 'singapore', tag: 'Modern', name: 'Singapore Sentosa & Gardens', itin: 'D1: Arrival. D2: Gardens by the Bay. D3: Sentosa Island. D4: Universal Studios. D5: Departure.' },
            { id: 'malaysia', tag: 'Bestseller', name: 'KL City & Genting Highlands', itin: 'D1: Arrival. D2: Batu Caves & Genting. D3: KL City & Putrajaya. D4: Departure.' },
            { id: 'philippines', tag: 'Island', name: 'Manila & El Nido Paradise', itin: 'D1: Manila. D2: Fly to El Nido. D3: Lagoon Hopping. D4: Beach Leisure. D5: Departure.' },

            // EAST ASIA
            { id: 'china', tag: 'Imperial', name: 'Great Wall & Shanghai Skyline', itin: 'D1: Beijing. D2: Forbidden City. D3: Great Wall. D4: Shanghai Bund. D5: Departure.' },
            { id: 'japan', tag: 'Cultural', name: 'Tokyo, Kyoto & Osaka Golden', itin: 'D1: Tokyo. D2: Mt. Fuji. D3: Shinkansen to Kyoto. D4: Osaka Castle. D5: Departure.' },
            { id: 'south korea', tag: 'Modern', name: 'Seoul & Nami Island', itin: 'D1: Arrival. D2: Palace & Bukchon. D3: Nami Island. D4: DMZ Tour. D5: Departure.' },

            // ISLANDS & AFRICA
            { id: 'seychelles', tag: 'Exclusive', name: 'Mahe & Praslin Island Hopper', itin: 'D1: Mahe. D2: Praslin Ferry. D3: Vallee de Mai. D4: Private Boat Charter. D5: Departure.' },
            { id: 'maldives', tag: 'Honeymoon', name: 'Water Villa Luxury Retreat', itin: 'D1: Speedboat. D2-D4: Lagoon Life. D5: Male City. D6: Departure.' },
            { id: 'mauritius', tag: 'Tropical', name: 'North & South Island Tour', itin: 'D1: Arrival. D2: Trou aux Cerfs. D3: Ile aux Cerfs. D4: Port Louis. D5: Departure.' },
            { id: 'egypt', tag: 'History', name: 'Cairo Pyramids & Nile Cruise', itin: 'D1: Giza Pyramids. D2: Sphinx. D3: Nile Cruise Check-in. D4: Valley of the Kings. D5: Departure.' },
            { id: 'kenya', tag: 'Safari', name: 'Maasai Mara Wildlife Safari', itin: 'D1: Nairobi. D2-D3: Game Drives. D4: Lake Nakuru. D5: Departure.' },

            // EUROPE & MIDDLE EAST
            { id: 'turkey', tag: 'Bestseller', name: 'Istanbul & Cappadocia Balloons', itin: 'D1: Istanbul. D2: Blue Mosque. D3: Fly to Cappadocia. D4: Balloon Ride. D5: Departure.' },
            { id: 'dubai', tag: 'Luxury', name: 'Burj Khalifa & Desert Safari', itin: 'D1: Arrival. D2: Dubai Mall. D3: 4x4 Desert Safari. D4: Abu Dhabi. D5: Departure.' },
            { id: 'italy', tag: 'Art', name: 'Rome, Florence & Venice', itin: 'D1: Rome. D2: Vatican. D3: Florence. D4: Venice Canals. D5: Departure.' },
            { id: 'france', tag: 'Romantic', name: 'Paris City & Seine River', itin: 'D1: Eiffel Tower. D2: Louvre. D3: Seine Cruise. D4: Disneyland. D5: Departure.' },
            { id: 'switzerland', tag: 'Scenic', name: 'Mt. Titlis & Lucerne Lake', itin: 'D1: Zurich. D2: Lucerne. D3: Mt. Titlis. D4: Interlaken. D5: Departure.' },
            { id: 'netherlands', tag: 'Culture', name: 'Amsterdam Canals & Windmills', itin: 'D1: Arrival. D2: Canal Cruise. D3: Zaanse Schans. D4: Departure.' }
        ];

        const id = new URLSearchParams(window.location.search).get('id');
        const container = document.getElementById('container');

        if(id) {
            const cleanId = decodeURIComponent(id).toLowerCase().trim();
            document.getElementById('title').innerText = cleanId.toUpperCase();
            document.getElementById('subject').value = "B2B INQUIRY: " + cleanId.toUpperCase();
            
            const filtered = pkgs.filter(p => p.id === cleanId);
            
            if(filtered.length > 0) {
                filtered.forEach(p => {
                    container.innerHTML += `
                        <div class="pkg-card">
                            <span class="tag">${p.tag}</span>
                            <h3>${p.name}</h3>
                            <div class="itin-box">
                                <strong>Sample B2B Route:</strong><br>${p.itin}
                            </div>
                            <a href="#enquiry" class="btn" onclick="prefill('${p.name}')">Request PDF & Rates</a>
                        </div>
                    `;
                });
            } else {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align:center;"><p style="color:var(--dim)">Detailed ground operational documents for ${cleanId.toUpperCase()} are available on request via the form below.</p></div>`;
            }
        }

        function prefill(pkgName) {
            document.getElementById('subject').value = "PACKAGE: " + pkgName;
            document.getElementById('msg-box').value = "I am interested in receiving the full PDF itinerary and B2B ground rates for: " + pkgName;
        }
    </script>
</body>
</html>
